name: PR smoke (prometheus build + docker run)

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          set -e
          make build
          test -f ./prometheus
          test -f ./promtool

      - name: Prepare binaries for Dockerfile COPY
        run: |
          set -e
          mkdir -p .build/linux-amd64
          cp -f ./prometheus .build/linux-amd64/prometheus
          cp -f ./promtool   .build/linux-amd64/promtool

      - name: Docker build
        run: |
          set -e
          docker build -t prometheus-pr:${GITHUB_SHA} .

      - name: Docker run + smoke check
        run: |
          set -e

          cleanup() {
            docker logs prom-smoke 2>/dev/null || true
            docker stop prom-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d --rm --name prom-smoke -p 19090:9090 \
            prometheus-pr:${GITHUB_SHA}

          sleep 15
          curl -f http://127.0.0.1:19090/-/ready
          # optional extra check:
          curl -f http://127.0.0.1:19090/metrics >/dev/null

      - name: Install Trivy (official installer)
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Trivy scan
        run: |
          set -euo pipefail
          trivy image prometheus-pr:${GITHUB_SHA} \
            --scanners vuln \
            --format table \
            --no-progress \
            --exit-code 0
